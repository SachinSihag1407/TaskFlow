openapi: 3.0.3
info:
  title: TaskFlow API
  version: "1.0.0"
  description: |
    REST API for TaskFlow, a distributed job scheduling and execution platform.

    **Authentication.** Sign in with `POST /api/v1/auth/login`. The session is an
    HttpOnly `tf_session` cookie. Every state-changing request must also send the
    `X-CSRF-Token` header with the `csrf_token` returned by login, register or
    `GET /api/v1/auth/me`.

    **Responses.** Successful responses are wrapped as `{"data": ...}`; list
    endpoints add `{"meta": {page, page_size, total, total_pages}}`. Errors are
    `{"error": {code, message, fields?, request_id}}`.

    **Roles.** `viewer` can read; `operator` can also manage jobs and runs;
    `admin` can additionally manage settings, members, workers and read the audit log.
servers:
  - url: /
tags:
  - name: Auth
  - name: Jobs
  - name: Schedules
  - name: Runs
  - name: Executions
  - name: Workers
  - name: Observability
  - name: Workspace
  - name: Probes
security:
  - session: []

paths:
  /healthz:
    get:
      tags: [Probes]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      tags: [Probes]
      summary: Readiness probe (PostgreSQL reachable)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: PostgreSQL unreachable }
  /metrics:
    get:
      tags: [Probes]
      summary: Prometheus metrics
      description: Protected by a bearer token when METRICS_TOKEN is configured.
      security: [{}, { metricsToken: [] }]
      responses:
        "200": { description: Prometheus text exposition format }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/openapi.yaml:
    get:
      tags: [Probes]
      summary: This specification
      security: []
      responses:
        "200": { description: OpenAPI document }
  /api/docs:
    get:
      tags: [Probes]
      summary: Swagger UI
      security: []
      responses:
        "200": { description: HTML page }

  /api/v1/auth/config:
    get:
      tags: [Auth]
      summary: Public auth configuration
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      registration_enabled: { type: boolean }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Create a workspace and its first admin user
      description: Rate limited to 5 requests per hour per IP. Disabled when ALLOW_REGISTRATION=false.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 128 }
                workspace: { type: string, maxLength: 100 }
      responses:
        "201": { $ref: "#/components/responses/Me" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: Sets the `tf_session` cookie. Rate limited per IP and per account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (revokes the session)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Signed out }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user, workspace and CSRF token
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/password:
    post:
      tags: [Auth]
      summary: Change password (revokes other sessions)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "204": { description: Changed }
        "422": { $ref: "#/components/responses/Validation" }

  /api/v1/handlers:
    get:
      tags: [Jobs]
      summary: List available job handlers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/HandlerInfo" } }
  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: Search, filter, sort and paginate jobs
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches name, description or exact id }
        - { name: status, in: query, schema: { type: string }, description: Comma-separated job statuses }
        - { name: handler, in: query, schema: { type: string }, description: Comma-separated handler names }
        - { name: schedule_type, in: query, schema: { type: string, enum: [once, delayed, cron] } }
        - { name: priority, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, created_at, updated_at, next_run_at, last_run_at, priority, status] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/JobListItem" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Jobs]
      summary: Create a job
      description: |
        Send an `Idempotency-Key` header to make retries safe: repeating the same
        request with the same key returns the original job (200 with
        `Idempotent-Replayed: true`); reusing a key with a different body is rejected (422).
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201": { $ref: "#/components/responses/Job" }
        "200": { $ref: "#/components/responses/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/jobs/bulk:
    post:
      tags: [Jobs]
      summary: Apply an action to up to 100 jobs
      description: Each job is processed independently; per-item results report successes and failures.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [pause, resume, cancel, retry] }
                ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/BulkResults" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [Jobs]
      summary: Job details with runs, attempts, timeline and permitted actions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/JobDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Jobs]
      summary: Replace a job's definition (optimistic concurrency)
      description: Edits apply to future runs only; queued runs keep their configuration snapshot.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: The job's current `version` }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "200": { $ref: "#/components/responses/Job" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "428": { description: If-Match header missing }
  /api/v1/jobs/{id}/runs:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [Jobs]
      summary: Paginated runs of a job
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { $ref: "#/components/responses/RunPage" }
  /api/v1/jobs/{id}/pause:
    parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
    post:
      tags: [Jobs]
      summary: Pause scheduling and hold queued runs
      responses:
        "200": { $ref: "#/components/responses/Job" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/jobs/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
    post:
      tags: [Jobs]
      summary: Resume a paused job (missed occurrences follow the missed-run policy)
      responses:
        "200": { $ref: "#/components/responses/Job" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/jobs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
    post:
      tags: [Jobs]
      summary: Cancel a job; waiting runs are cancelled, running runs asked to stop
      responses:
        "200": { $ref: "#/components/responses/Job" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/jobs/{id}/retry:
    parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
    post:
      tags: [Jobs]
      summary: Retry a failed one-time job
      responses:
        "201": { $ref: "#/components/responses/Run" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/jobs/{id}/run:
    parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
    post:
      tags: [Jobs]
      summary: Trigger an immediate run of a recurring job
      responses:
        "201": { $ref: "#/components/responses/Run" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schedules:
    get:
      tags: [Schedules]
      summary: Recurring jobs with upcoming and recent runs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ScheduleView" } }
  /api/v1/schedules/preview:
    post:
      tags: [Schedules]
      summary: Validate a cron expression and preview upcoming times
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron_expr, timezone]
              properties:
                cron_expr: { type: string, example: "0 9 * * 1-5" }
                timezone: { type: string, example: Europe/Berlin }
                count: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      next_runs: { type: array, items: { type: string, format: date-time } }
        "422": { $ref: "#/components/responses/Validation" }

  /api/v1/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [Runs]
      summary: Run details with attempts, events and audit trail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RunDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/runs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
    post:
      tags: [Runs]
      summary: Cancel one run (cooperative if running)
      responses:
        "200": { $ref: "#/components/responses/Run" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/runs/{id}/replay:
    parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
    post:
      tags: [Runs]
      summary: Replay a dead-lettered run (at most once per run)
      responses:
        "201": { $ref: "#/components/responses/Run" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/dead-letter:
    get:
      tags: [Runs]
      summary: Dead-lettered runs (exhausted their retry policy)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: job_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { $ref: "#/components/responses/RunPage" }
  /api/v1/dead-letter/replay:
    post:
      tags: [Runs]
      summary: Replay up to 100 dead-lettered runs
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/BulkResults" }

  /api/v1/executions:
    get:
      tags: [Executions]
      summary: Search execution attempts
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches job name or error message }
        - { name: status, in: query, schema: { type: string } }
        - { name: handler, in: query, schema: { type: string } }
        - { name: job_id, in: query, schema: { type: string, format: uuid } }
        - { name: run_id, in: query, schema: { type: string, format: uuid } }
        - { name: worker_id, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [started_at, duration_ms] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /api/v1/executions/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [Executions]
      summary: One attempt with its run and logs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attempt: { $ref: "#/components/schemas/Attempt" }
                      run: { $ref: "#/components/schemas/Run" }
                      logs: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/executions/{id}/logs:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [Executions]
      summary: Attempt logs after a cursor (for following a running attempt)
      parameters:
        - { name: after, in: query, schema: { type: integer }, description: Return lines with id greater than this }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LogLine" } }

  /api/v1/workers:
    get:
      tags: [Workers]
      summary: Workers seen in the last 24 hours
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Worker" } }
  /api/v1/workers/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [Workers]
      summary: Worker details with running runs and recent activity (workspace-scoped)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      worker: { $ref: "#/components/schemas/Worker" }
                      running_runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
                      recent_attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
                      events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workers/{id}/drain:
    parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
    post:
      tags: [Workers]
      summary: Ask a worker to stop claiming work and shut down gracefully (platform admins only)
      description: Workers are shared by all workspaces, so this requires an admin whose email is listed in PLATFORM_ADMIN_EMAILS.
      responses:
        "202": { description: Drain requested }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/analytics/overview:
    get:
      tags: [Observability]
      summary: Dashboard metrics computed from stored executions
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Overview" }
  /api/v1/system/health:
    get:
      tags: [Observability]
      summary: Dependency, scheduler, worker and queue health
      responses:
        "200":
          description: Always 200; each component reports its own status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Health" }
  /api/v1/events:
    get:
      tags: [Observability]
      summary: Operational event stream (newest first)
      parameters:
        - { name: severity, in: query, schema: { type: string } }
        - { name: job_id, in: query, schema: { type: string, format: uuid } }
        - { name: run_id, in: query, schema: { type: string, format: uuid } }
        - { name: worker_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Event" } }
  /api/v1/events/stream:
    get:
      tags: [Observability]
      summary: Server-Sent Events stream of lifecycle changes
      description: |
        `event: status` carries `{"live": bool}`; `event: update` carries
        `{type, job_id, run_id, status, at}`. Events contain identifiers only;
        clients re-fetch data through the API. When `live` is false, clients
        should poll.
      responses:
        "200": { description: text/event-stream }
  /api/v1/notifications:
    get:
      tags: [Observability]
      summary: Recent warnings and errors with unread count
      responses:
        "200": { description: OK }
  /api/v1/notifications/seen:
    post:
      tags: [Observability]
      summary: Mark notifications as read
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: OK }

  /api/v1/workspace:
    get:
      tags: [Workspace]
      summary: Current workspace
      responses:
        "200": { description: OK }
  /api/v1/settings:
    get:
      tags: [Workspace]
      summary: Workspace execution defaults and limits
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Settings" }
    put:
      tags: [Workspace]
      summary: Update workspace settings (admin, audited)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/audit:
    get:
      tags: [Workspace]
      summary: Audit log (admin)
      parameters:
        - { name: action, in: query, schema: { type: string }, description: Prefix match, e.g. `run.` }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /api/v1/users:
    get:
      tags: [Workspace]
      summary: Workspace members (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      tags: [Workspace]
      summary: Add a member (admin)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                role: { type: string, enum: [admin, operator, viewer] }
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/users/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [Workspace]
      summary: Change a member's role or disable them (admin)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, operator, viewer] }
                disabled: { type: boolean }
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tf_session
    metricsToken:
      type: http
      scheme: bearer
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
  responses:
    Me:
      description: Session established / current session
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  workspace:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                  csrf_token: { type: string }
                  platform_admin: { type: boolean, description: May operate shared infrastructure (drain workers) }
    Job:
      description: Job
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Job" }
    Run:
      description: Run
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Run" }
    RunPage:
      description: Page of runs
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: "#/components/schemas/Run" } }
              meta: { $ref: "#/components/schemas/PageMeta" }
    BulkResults:
      description: Per-item results
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    ok: { type: boolean }
                    code: { type: string }
                    message: { type: string }
    Validation:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not allowed in the resource's current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (or not visible to this workspace)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Role does not permit the action, or CSRF check failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests (see Retry-After)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            request_id: { type: string }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    JobStatus:
      type: string
      enum: [CREATED, SCHEDULED, QUEUED, RUNNING, RETRY_WAIT, PAUSED, SUCCEEDED, FAILED, CANCELLED]
    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]
    JobInput:
      type: object
      required: [name, handler, schedule_type]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        handler: { type: string, example: report.generate }
        payload: { type: object, description: Handler-specific JSON object (max 64 KB) }
        schedule_type: { type: string, enum: [once, delayed, cron] }
        run_at: { type: string, format: date-time, description: "once: when to run (default: now)" }
        delay_seconds: { type: integer, description: "delayed: seconds from now" }
        cron_expr: { type: string, description: "cron: 5-field expression or @hourly/@daily/…" }
        timezone: { type: string, example: Europe/Berlin }
        missed_run_policy: { type: string, enum: [skip, run_once, run_all] }
        overlap_policy: { type: string, enum: [skip, queue, allow] }
        max_concurrency: { type: integer, minimum: 1, maximum: 100, description: Used when overlap_policy=allow }
        priority: { type: integer, minimum: 1, maximum: 10 }
        max_attempts: { type: integer, minimum: 1, maximum: 25 }
        backoff_base_seconds: { type: integer, minimum: 1, maximum: 3600 }
        backoff_max_seconds: { type: integer, minimum: 1, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 86400 }
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        handler: { type: string }
        payload: { type: object }
        schedule_type: { type: string }
        run_at: { type: string, format: date-time, nullable: true }
        cron_expr: { type: string, nullable: true }
        timezone: { type: string }
        missed_run_policy: { type: string }
        overlap_policy: { type: string }
        max_concurrency: { type: integer }
        priority: { type: integer }
        max_attempts: { type: integer }
        backoff_base_seconds: { type: integer }
        backoff_max_seconds: { type: integer }
        timeout_seconds: { type: integer }
        status: { $ref: "#/components/schemas/JobStatus" }
        next_run_at: { type: string, format: date-time, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_run_status: { $ref: "#/components/schemas/RunStatus" }
        paused_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        idempotency_key: { type: string, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JobListItem:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          properties:
            succeeded_runs: { type: integer }
            failed_runs: { type: integer }
            active_runs: { type: integer }
    ActionState:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }
    JobDetail:
      type: object
      properties:
        job: { $ref: "#/components/schemas/Job" }
        actions:
          type: object
          description: Keys edit, pause, resume, cancel, retry, run_now
          additionalProperties: { $ref: "#/components/schemas/ActionState" }
        active_runs: { type: integer }
        upcoming_runs: { type: array, items: { type: string, format: date-time } }
        handler: { $ref: "#/components/schemas/HandlerInfo" }
        runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
        attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
    ScheduleView:
      type: object
      properties:
        job: { $ref: "#/components/schemas/Job" }
        upcoming_runs: { type: array, items: { type: string, format: date-time } }
        recent_runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        job_name: { type: string }
        scheduled_for: { type: string, format: date-time }
        trigger: { type: string, enum: [schedule, manual, retry, replay] }
        status: { $ref: "#/components/schemas/RunStatus" }
        priority: { type: integer }
        handler: { type: string }
        payload: { type: object }
        timeout_seconds: { type: integer }
        max_attempts: { type: integer }
        attempt: { type: integer }
        worker_id: { type: string, format: uuid, nullable: true }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        queued_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        cancel_requested_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        result: { type: object, nullable: true }
        dead_lettered_at: { type: string, format: date-time, nullable: true }
        replayed_at: { type: string, format: date-time, nullable: true }
        replay_of: { type: string, format: uuid, nullable: true }
    RunDetail:
      type: object
      properties:
        run: { $ref: "#/components/schemas/Run" }
        attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        audit: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
    Attempt:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        job_name: { type: string }
        attempt_number: { type: integer }
        max_attempts: { type: integer }
        worker_id: { type: string, format: uuid, nullable: true }
        worker_hostname: { type: string }
        handler: { type: string }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED, TIMED_OUT, CANCELLED, LOST] }
        queued_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error_kind: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        retryable: { type: boolean, nullable: true }
        next_retry_at: { type: string, format: date-time, nullable: true }
    LogLine:
      type: object
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }
    Worker:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        pid: { type: integer }
        version: { type: string }
        concurrency: { type: integer }
        handlers: { type: array, items: { type: string } }
        status: { type: string, enum: [ONLINE, DRAINING, STALE, OFFLINE] }
        active_runs: { type: integer }
        completed_count: { type: integer }
        failed_count: { type: integer }
        heap_alloc_bytes: { type: integer, nullable: true }
        goroutines: { type: integer, nullable: true }
        started_at: { type: string, format: date-time }
        last_heartbeat_at: { type: string, format: date-time }
        seconds_since_heartbeat: { type: number }
        stopped_at: { type: string, format: date-time, nullable: true }
    Event:
      type: object
      properties:
        id: { type: integer }
        job_id: { type: string, format: uuid, nullable: true }
        run_id: { type: string, format: uuid, nullable: true }
        worker_id: { type: string, format: uuid, nullable: true }
        type: { type: string, example: run.dead_lettered }
        severity: { type: string, enum: [info, warning, error] }
        message: { type: string }
        data: { type: object }
        created_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_email: { type: string, nullable: true }
        action: { type: string, example: run.replay }
        target_type: { type: string }
        target_id: { type: string }
        ip: { type: string, nullable: true }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
    Settings:
      type: object
      properties:
        default_max_attempts: { type: integer }
        default_timeout_seconds: { type: integer }
        default_backoff_base_seconds: { type: integer }
        default_backoff_max_seconds: { type: integer }
        default_priority: { type: integer }
        default_timezone: { type: string }
        max_concurrent_runs: { type: integer, description: 0 = unlimited }
        event_retention_days: { type: integer }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        last_login_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    HandlerInfo:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        idempotency: { type: string }
        example_payload: { type: object }
        fields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              required: { type: boolean }
              description: { type: string }
    Overview:
      type: object
      properties:
        range: { type: string }
        total_jobs: { type: integer }
        job_counts: { type: object, additionalProperties: { type: integer } }
        queued: { type: integer }
        running: { type: integer }
        retry_wait: { type: integer }
        dead_letter: { type: integer }
        success_rate: { type: number, nullable: true }
        outcomes:
          type: object
          properties:
            runs_succeeded: { type: integer }
            runs_failed: { type: integer }
            runs_cancelled: { type: integer }
            attempts_total: { type: integer }
            attempts_failed: { type: integer }
            retries: { type: integer }
            latency_samples: { type: integer }
            latency_avg_ms: { type: number, nullable: true }
            latency_p50_ms: { type: number, nullable: true }
            latency_p95_ms: { type: number, nullable: true }
            latency_p99_ms: { type: number, nullable: true }
            queue_wait_avg_ms: { type: number, nullable: true }
            queue_wait_p95_ms: { type: number, nullable: true }
        throughput:
          type: array
          items:
            type: object
            properties:
              bucket: { type: string, format: date-time }
              succeeded: { type: integer }
              failed: { type: integer }
        by_handler: { type: array, items: { type: object } }
        workers: { type: object }
        queue: { type: object }
        recent_attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
    Health:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded, down] }
        checked_at: { type: string, format: date-time }
        components:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [healthy, degraded, down, disabled] }
              latency_ms: { type: number }
              detail: { type: string }
        schedulers: { type: array, items: { type: object } }
        workers: { type: object }
        queue: { type: object }
        rates: { type: object }
        live_updates: { type: boolean }
        sse_clients: { type: integer }
